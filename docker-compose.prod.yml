# Production stack: Caddy terminates TLS (Let's Encrypt automatic HTTPS).
# https://caddyserver.com/docs/automatic-https
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# API and Postgres stay on the Docker network. Only 80/443 are published.

services:
  api:
    ports: !reset []
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      OPENAPI_URL: ""
      TRUST_PROXY: "true"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-ragent.bob4.fun}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ragent.bob4.fun}
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*

  web:
    ports: !reset []
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
