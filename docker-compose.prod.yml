# Production overlay. Do not publish API/Postgres.
# This VPS already has Caddy (bob4fun-geodat-editor) on :80/:443 —
# attach `web` to that network and add ragent.bob4.fun to that Caddyfile.
# https://caddyserver.com/docs/automatic-https
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  api:
    ports: !reset []
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      OPENAPI_URL: ""
      TRUST_PROXY: "true"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-ragent.bob4.fun}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ragent.bob4.fun}
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*

  web:
    ports: !reset []
    expose:
      - "80"
    networks:
      default: {}
      edge:
        aliases:
          - remna-agent-web

networks:
  edge:
    external: true
    name: bob4fun-geodat-editor_default
